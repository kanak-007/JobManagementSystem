{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply for {{ job.title }} - JobPortal</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            Job<span>Portal</span>
        </div>

        <ul class="nav-links">

            <li>
                <a href="/">Home</a>
            </li>

            <li>
                <a href="#">Jobs</a>
            </li>

            <li>
                <a href="#">Companies</a>
            </li>

            <li>
                <a href="#">About</a>
            </li>

        </ul>

        <div class="nav-buttons">

            <a href="#" class="login-btn">
                Login
            </a>

            <a href="#" class="register-btn">
                Register
            </a>

        </div>

    </nav>


    <!-- APPLICATION FORM -->

    <section class="application-section">

        <div class="application-container">

            <div class="application-heading">

                <p class="section-subtitle">
                    APPLY NOW
                </p>

                <h1>
                    Apply for <span>{{ job.title }}</span>
                </h1>

                <p>
                    {{ job.company }} • {{ job.location }}
                </p>

            </div>


            <form
                method="POST"
                enctype="multipart/form-data"
                class="application-form"
            >

                {% csrf_token %}


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="applicant_name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <!-- RESUME -->

                <div class="form-group">

                    <label for="resume">
                        Upload Resume
                    </label>

                    <input
                        type="file"
                        id="resume"
                        name="resume"
                        accept=".pdf,.doc,.docx"
                    >

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="submit-application-btn"
                >
                    Submit Application
                </button>


            </form>

        </div>

    </section>


</body>

</html>
